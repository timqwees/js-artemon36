<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5</title>
    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            Тема
        </button>
    </header>

    <main>
        <section class="gallery-section">
            <div class="gallery-header">
                <h2>Галерея</h2>
                <button class="refresh-button" id="refreshGallery">Обновить</button>
            </div>
            <div id="galleryContent">
                <div class="loader" id="galleryLoader"></div>
            </div>
        </section>

        <section class="temperature-section">
            <h2>Отчет температуры</h2>
            <form class="temperature-form" id="temperatureForm">
                <div class="form-group">
                    <label for="roomNumber">Номер комнаты:</label>
                    <input type="text" id="roomNumber" name="roomNumber" required>
                </div>
                <div class="form-group">
                    <label for="temperature">Температура (°C):</label>
                    <input type="number" id="temperature" name="temperature" step="0.1" required>
                </div>
                <button type="submit" class="submit-button">отправить</button>
            </form>
        </section>
    </main>

    <div class="toast-container" id="toastContainer"></div>

    <div id="root"></div>
    <script src="constructor.js"></script>
</body>

</html>
